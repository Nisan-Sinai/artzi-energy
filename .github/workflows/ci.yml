name: Artzi Site Quality Gate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax and static build
        run: |
          npm run lint
          npm run build
          npm test
      - name: Browser setup
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility
        run: npm run test:e2e
      - name: Save test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
