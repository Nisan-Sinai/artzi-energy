name: Artzi Site Quality Gate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan pull-request changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Scan every commit in repository history
        run: gitleaks git --redact --verbose .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Syntax and static build
        run: |
          npm run lint
          npm run build
          npm test
      - name: Supabase contact endpoint contract (non-destructive)
        run: node scripts/test-contact.mjs
      - name: Browser setup
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility
        run: npm run test:e2e
      - name: Save test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Lighthouse audits in mobile mode
        run: |
          node scripts/serve.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx --yes lighthouse@12 http://127.0.0.1:4173/he/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=lighthouse-he.json
          npx --yes lighthouse@12 http://127.0.0.1:4173/en/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=lighthouse-en.json
          npx --yes lighthouse@12 http://127.0.0.1:4173/he/insights/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=lighthouse-magazine.json
          node scripts/report-lighthouse.mjs
      - name: Upload Lighthouse measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-audits
          path: lighthouse-*.json
          if-no-files-found: ignore
